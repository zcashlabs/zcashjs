[package]
name = "zakura-lightwire"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
[workspace]
[lib]
crate-type = ["rlib", "cdylib"]
[dependencies]
prost = "=0.14.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

# Only the WASM codec build exports through wasm-bindgen; native builds use the Rust API.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
