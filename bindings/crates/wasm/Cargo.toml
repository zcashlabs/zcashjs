[package]
name = "zakura-bindings-wasm"
description = "wasm-bindgen front-end for zakura-bindings-core"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
build = "build.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["viewing", "birthday", "standalone-pczt"]
viewing = ["zakura-bindings-core/viewing"]
birthday = ["zakura-bindings-core/birthday", "dep:getrandom"]
standalone-pczt = ["zakura-bindings-core/standalone-pczt"]
wallet-storage = ["zakura-bindings-core/wallet-storage", "standalone-pczt", "dep:rusqlite", "dep:getrandom", "dep:uuid", "dep:time"]
wallet-threaded = ["wallet-storage", "zakura-bindings-core/wallet-threaded", "dep:rayon"]

[dependencies]
zakura-bindings-core = { path = "../core", default-features = false }
wasm-bindgen = "=0.2.128"
rayon = { version = "=1.12.0", optional = true }
rusqlite = { version = "=0.37.0", features = ["bundled", "array"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Upstream finalization and fused execution call OffsetDateTime::now_utc directly.
time = { version = "=0.3.55", features = ["wasm-bindgen"], optional = true }
getrandom = { version = "=0.4.3", features = ["wasm_js"], optional = true }
uuid = { version = "=1.26.1", features = ["js"], optional = true }
