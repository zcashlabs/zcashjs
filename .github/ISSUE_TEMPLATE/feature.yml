name: Feature proposal
description: Propose a developer journey or an improvement to the API.
body:
  - type: markdown
    attributes:
      value: |
        **Experimental release candidate.** See [platform requirements and current limits](https://zcashlabs.github.io/zcashjs/api/platforms.html).

        Do not submit credentials, mnemonics, keys, wallet identifiers, addresses, txids, PCZTs, database contents, or sensitive logs. Use synthetic examples and placeholder URLs/paths only.
  - type: textarea
    id: need
    attributes:
      label: Developer need
      description: Describe the journey and link related decisions or planning documents.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain scope, alternatives, and authority/state/recovery implications.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Safe report
      options:
        - label: "I used synthetic data and excluded all sensitive material listed above."
          required: true
