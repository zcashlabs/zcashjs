name: Configuration or runtime issue
description: Discuss SDK or docs tooling configuration and runtime requirements.
body:
  - type: markdown
    attributes:
      value: |
        **Experimental release candidate.** See [platform requirements and current limits](https://zcashlabs.github.io/zcashjs/api/platforms.html).

        Do not submit credentials, mnemonics, keys, wallet identifiers, addresses, txids, PCZTs, database contents, or sensitive logs. Use synthetic examples and placeholder URLs/paths only.
  - type: textarea
    id: context
    attributes:
      label: Configuration context
      description: Specify the SDK version, Node/browser version, and SDK or docs tooling configuration.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Question or failure
      description: Give minimal reproduction steps with synthetic configuration, placeholder paths/URLs, safe error codes, and expected behavior. Do not paste raw logs.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Safe report
      options:
        - label: "I used synthetic data and excluded all sensitive material listed above."
          required: true
