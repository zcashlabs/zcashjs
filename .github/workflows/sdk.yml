name: SDK regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            .cache/native
            .cache/proving
          key: sdk-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/native-source.json', 'scripts/build-native-wallet.js', 'src/wallet/proving-assets.ts') }}
      - run: npm ci
      - run: npm run check
